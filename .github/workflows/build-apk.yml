name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi
          if ! command -v java >/dev/null 2>&1; then
            echo "Error: java command not found in PATH." >&2
            exit 1
          fi
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Unable to detect Java version string." >&2
            exit 1
          fi
          JAVA_MAJOR=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Unable to determine Java major version." >&2
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version $JAVA_MAJOR is below required version 17." >&2
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore does not exist after generation attempt." >&2
            exit 1
          fi
          echo "Debug keystore confirmed present at ./debug.keystore"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ] && [[ "$EXPECTED_APK" == *.apk ]]; then
            echo "Verified debug APK exists at expected path: $EXPECTED_APK"
            ls -lh "$EXPECTED_APK"
          else
            echo "Error: Expected debug APK not found or invalid at $EXPECTED_APK" >&2
            echo "Searching within app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/apk-release-asset"
          mkdir -p "$TEMP_DIR"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TEMP_DIR/app-debug.apk"
          ASSET_PATH="$TEMP_DIR/app-debug.apk"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $ASSET_PATH" >&2
            exit 1
          fi
          echo "Prepared release asset at: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET" ] || [ ! -s "$ASSET" ]; then
            echo "Error: Release asset does not exist or is empty at $ASSET" >&2
            exit 1
          fi

          BASENAME=$(basename "$ASSET")
          if [ "$BASENAME" != "app-debug.apk" ]; then
            echo "Error: Release asset filename is '$BASENAME', expected 'app-debug.apk'" >&2
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="OutbreakShield AI — Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ## OutbreakShield AI — Automatic Debug APK Build

          This is an automatically generated OutbreakShield AI debug APK built by GitHub Actions.

          - **Workflow Run:** #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **Source Commit:** `${{ github.sha }}`
          - **Artifact Name:** `app-debug.apk`

          ### Important Notices:
          - This APK is intended for testing, not production or Google Play Store distribution.
          - The APK uses debug signing, not production release signing.
          - Live Gemini integration is not configured unless it has actually been implemented and verified.
          EOF
          )

          gh release create "$TAG_NAME" "$ASSET" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== OUTBREAKSHIELD AI — BUILD & RELEASE SUMMARY ==="

          APK_BUILT=false
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_BUILT=true
          fi

          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release publishing succeeded!"
            gh release view "$TAG_NAME" || true

            DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            RELEASE_PAGE="https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG_NAME"

            echo "Release Tag: $TAG_NAME"
            echo "Release Page: $RELEASE_PAGE"
            echo "Direct APK Download: $DOWNLOAD_URL"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "[Download app-debug.apk]($DOWNLOAD_URL)"
              echo ""
              echo "- **Direct Download URL:** \`$DOWNLOAD_URL\`"
              echo "- **Release Page:** $RELEASE_PAGE"
              echo "- **Actions Artifact:** The build artifact \`app-debug-apk\` remains available as a backup in the summary above."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped (outcome: $RELEASE_OUTCOME)."
            if [ "$APK_BUILT" = "true" ]; then
              echo "Debug APK build succeeded."
              echo "The Actions artifact 'app-debug-apk' remains available for download from this workflow run."
              {
                echo "## Debug APK Build Completed"
                echo ""
                echo "Debug APK was successfully built and uploaded as Actions artifact **\`app-debug-apk\`**."
                echo ""
                echo "> **Notice:** GitHub Release creation failed or was skipped. Please download the APK from the **Artifacts** section of this workflow run."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Debug APK build did not complete successfully."
              {
                echo "## Build Failed"
                echo ""
                echo "The debug APK build did not produce the expected APK artifact."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
